publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.1.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.3
  provider: ^6.1.2
  razorpay_flutter: ^1.3.7
  http: ^1.2.2
