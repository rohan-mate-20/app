<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kmart_customer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>K MART - Daily Essentials Delivered</title>
  <link rel="manifest" href="manifest.json">
  <!-- Razorpay Checkout for Web -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openKmartRazorpay = function(options, successCb, errorCb) {
      try {
        var cleanOptions = {};
        for (var k in options) {
          if (options.hasOwnProperty(k)) {
            cleanOptions[k] = options[k];
          }
        }
        cleanOptions.handler = function(response) {
          if (successCb) {
            successCb(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
          }
        };
        cleanOptions.modal = cleanOptions.modal || {};
        cleanOptions.modal.ondismiss = function() {
          if (errorCb) {
            errorCb(2, "Payment cancelled by user");
          }
        };
        var rzp = new window.Razorpay(cleanOptions);
        rzp.on('payment.failed', function(resp) {
          if (errorCb) {
            var err = (resp && resp.error) ? resp.error : {};
            errorCb(err.code || 0, err.description || "Payment failed");
          }
        });
        rzp.open();
      } catch (err) {
        console.error("Razorpay Web open exception:", err);
        if (errorCb) {
          errorCb(0, err.message || "Failed to initialize Razorpay");
        }
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
