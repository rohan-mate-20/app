name: Build & Release macOS Desktop App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release with this macOS app?'
        type: boolean
        default: true
      version_tag:
        description: 'Release Tag (e.g., v1.0.0-macos)'
        type: string
        default: 'v1.0.0-macos'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_macos.yml'

permissions:
  contents: write

env:
  LANG: 'en_US.UTF-8'

jobs:
  build-macos:
    name: Build macOS Desktop App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd macos
          pod install
          cd ..

      - name: Run Unit Tests
        run: flutter test test/pricing_and_ui_test.dart

      - name: Build macOS Application (Release)
        run: |
          flutter build macos --release

      - name: Package macOS App into Zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../kmart-macos-desktop.zip "K MART.app"
          cd ../../../../..
          ls -lh kmart-macos-desktop.zip

      - name: Upload macOS App as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmart-macos-desktop-app
          path: kmart-macos-desktop.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: kmart-macos-desktop.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version_tag || 'v1.0.0-macos' }}
          name: "macOS Desktop Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version_tag || 'v1.0.0-macos' }}"
          body: |
            ## K MART macOS Desktop Application (.app)
            
            - **App Name:** K MART Desktop
            - **Platform:** macOS (Apple Silicon & Intel)
            - **Packaging:** Native macOS Application (`K MART.app` inside zip)
            
            ### How to install on your Mac:
            1. Download and unzip `kmart-macos-desktop.zip`.
            2. Drag `K MART.app` into your **Applications** folder.
            3. Right-click (Control-click) `K MART.app` and select **Open** (required on first launch for third-party apps).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
