name: Build & Release iOS & macOS Apps

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release with these apps?'
        type: boolean
        default: true
      version_tag:
        description: 'Release Tag (e.g., v1.0.0-apple)'
        type: string
        default: 'v1.0.0-apple'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'macos/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_ios.yml'

permissions:
  contents: write

env:
  LANG: 'en_US.UTF-8'

jobs:
  build-ipa:
    name: Build iOS IPA (iPhone)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build iOS Application (No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y ../../../kmart-customer.ipa Payload
          cd ../../..
          ls -lh kmart-customer.ipa

      - name: Upload IPA as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmart-customer-ios-ipa
          path: kmart-customer.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: kmart-customer.ipa
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version_tag || 'v1.0.0-apple' }}
          name: "Apple Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version_tag || 'v1.0.0-apple' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Desktop App (MacBook)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Desktop App (Release)
        run: |
          flutter build macos --release

      - name: Package macOS App into Zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../kmart-macos-desktop.zip "K MART.app"
          cd ../../../../..
          ls -lh kmart-macos-desktop.zip

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmart-macos-desktop-app
          path: kmart-macos-desktop.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: kmart-macos-desktop.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version_tag || 'v1.0.0-apple' }}
          name: "Apple Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version_tag || 'v1.0.0-apple' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
